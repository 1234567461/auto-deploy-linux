name: 构建预安装 PaperMC 的树莓派镜像

on:
  push:
    branches: [rpi-image-build]
    paths:
      - 'rpi/pi-gen/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build:
    name: pi-gen 构建镜像
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools libarchive-tools xz-utils qemu-utils docker.io docker-buildx
          sudo usermod -aG docker $USER

      - name: 构建
        run: |
          cd rpi/pi-gen
          bash build-custom.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mc-pi-image
          path: rpi/pi-gen/work/pi-gen/deploy/*.img.xz
          retention-days: 7

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rpi/pi-gen/work/pi-gen/deploy/*.img.xz
